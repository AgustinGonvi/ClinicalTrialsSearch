name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Offline regression tests
        run: python -m unittest discover -s tests
      - name: Check tracked files for publication leaks
        run: python tools/check_public_tree.py
      - name: Validate distributed profiles
        run: |
          cts validate-profile profiles/kidney-small.json
          cts validate-profile profiles/kidney-ckd.json
          cts validate-profile profiles/template.json
